<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="description" content="Simple Azure Data Engineer job search dashboard." />
  <title>Job Search Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Job Search</h1>
        <p class="subtitle">Azure Data Engineer · 4–6 years · India</p>
      </div>
      <div class="top-actions">
        <button class="button ghost" id="shareBtn" type="button">Copy link</button>
        <button class="button" id="editBtn" type="button">Filters</button>
      </div>
    </header>

    <section class="preset-grid" id="presetGrid" aria-label="Search presets"></section>

    <div class="section-row">
      <h2>Portals</h2>
      <button class="button ghost" id="openAllBtn" type="button">Open all</button>
    </div>
    <section class="portal-grid" id="portalGrid" aria-label="Job portals"></section>

    <p class="footer-note">Use 24h daily. Use 7 days every 2–3 days.</p>
  </main>

  <dialog id="filterDialog">
    <form id="filterForm" method="dialog" class="dialog-card">
      <div class="dialog-head">
        <h2>Search filters</h2>
        <button class="icon-btn" id="closeBtn" type="button" aria-label="Close">×</button>
      </div>

      <label>
        <span>Keywords</span>
        <input id="keywords" name="keywords" autocomplete="off" />
      </label>

      <div class="two-col">
        <label>
          <span>Min experience</span>
          <input id="minExp" name="minExp" type="number" min="0" max="30" />
        </label>
        <label>
          <span>Max experience</span>
          <input id="maxExp" name="maxExp" type="number" min="0" max="30" />
        </label>
      </div>

      <label>
        <span>Location</span>
        <input id="location" name="location" autocomplete="off" />
      </label>

      <div class="two-col">
        <label>
          <span>Date posted</span>
          <select id="datePosted" name="datePosted">
            <option value="24h">Past 24 hours</option>
            <option value="7d">Past 7 days</option>
            <option value="30d">Past 30 days</option>
          </select>
        </label>
        <label>
          <span>Sort</span>
          <select id="sortBy" name="sortBy">
            <option value="date">Newest first</option>
            <option value="relevance">Relevance</option>
          </select>
        </label>
      </div>

      <div class="dialog-actions">
        <button class="button ghost" id="resetBtn" type="button">Reset</button>
        <button class="button" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
